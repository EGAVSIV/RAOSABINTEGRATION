name: Index Data Fetch (3:30 PM IST)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1-5'   # 10:00 UTC = 15:30 IST

permissions:
  contents: write

concurrency:
  group: index-data-fetch
  cancel-in-progress: false

jobs:
  run-sector-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pandas pyarrow
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Run scripts
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python Sectordatafetch.py
          python Broad_index_data_fetch.py

      - name: Commit and push generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add BOTH output directories to git tracking
          git add sectorial_index_data Broad_index_data || true
          git commit -m "Auto update sectorial and broad index data [CI]" || echo "Nothing to commit"

          git pull --rebase origin main
          git push origin main
