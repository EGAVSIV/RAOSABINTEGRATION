name: PNTR - Weekly Levels and Daily ATR

on:
  schedule:
    # 17:00 IST = 11:30 UTC
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pntr/requirements.txt

      - name: Install dependencies
        run: pip install -r pntr/requirements.txt

      - name: Calculate daily ATR
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 11 * * *'
        run: |
          python -c "from pntr.weekly_levels import build; build()"

      - name: Commit daily ATR output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pntr/data/atr_daily.json
          if git diff --cached --quiet; then
            echo "No ATR changes to commit."
          else
            git commit -m "Update PNTR daily ATR data"
            git push
          fi

  weekly-levels:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 11 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Friday
        id: friday
        run: |
          if [ "$(date -u +%u)" = "5" ]; then
            echo "is_friday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_friday=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.friday.outputs.is_friday == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pntr/requirements.txt

      - name: Install dependencies
        if: steps.friday.outputs.is_friday == 'true'
        run: pip install -r pntr/requirements.txt

      - name: Calculate weekly levels
        if: steps.friday.outputs.is_friday == 'true'
        run: python -c "from pntr.weekly_levels import build; build()"

      - name: Commit weekly levels
        if: steps.friday.outputs.is_friday == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pntr/data/weekly_levels.json
          if git diff --cached --quiet; then
            echo "No weekly level changes to commit."
          else
            git commit -m "Update PNTR weekly price levels"
            git push
          fi
