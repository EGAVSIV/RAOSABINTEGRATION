name: PNTR - Daily ATR and Friday Weekly Levels

on:
  schedule:
    # 17:00 IST = 11:30 UTC
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pntr/requirements.txt

      - name: Install dependencies
        run: pip install -r pntr/requirements.txt

      - name: Calculate daily ATR
        run: python -c "from pntr.weekly_levels import build; build()"

      - name: Stage daily ATR output
        run: git add pntr/data/atr_daily.json

      - name: Stage Friday weekly levels
        run: |
          if [ "$(date -u +%u)" = "5" ]; then
            echo "Friday: staging weekly levels"
            git add pntr/data/weekly_levels.json
          else
            echo "Not Friday: weekly levels will not be updated"
          fi

      - name: Commit and push market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No market data changes to commit."
            exit 0
          fi

          git commit -m "Update PNTR market data"

          # Another workflow may have committed while this job calculated data.
          # Rebase the generated commit on the current remote main before push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
