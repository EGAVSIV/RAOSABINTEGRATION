name: Geotrader Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-engine:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Enables push permissions for committing result.json

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Geotrader Engine
      env:
        API_KEY: ${{ secrets.API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python geotrader/engine.py

    - name: Commit and Push geotrader/result.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add geotrader/result.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update geotrader/result.json [skip ci]" && git push)
