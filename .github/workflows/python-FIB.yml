name: Run FIB Engine Scan

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Grant write permissions to GITHUB_TOKEN at the workflow/job level
permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Pass explicit token authorization for pushing
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Execute Engine Script
        run: |
          python fib/engine.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git rm --cached results.json --ignore-unmatch
          git add fib/results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock analysis results [skip ci]" && git push)
