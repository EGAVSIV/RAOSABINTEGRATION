name: Sector DB Outputfile

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 3:30 PM IST, Mon-Fri (10:00 UTC)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sector-engine
  cancel-in-progress: false   # if two runs overlap, queue the second instead of racing it

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f sector/requirements.txt ]; then pip install -r sector/requirements.txt; fi

      - name: Execute sector engine
        run: |
          cd sector
          python engine.py

      - name: Show what changed (debug)
        run: |
          git status --porcelain sector/

      - name: Commit and push updated results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add sector/result.json sector/state/previous_rotation.json

          # Nothing to commit -> stop here, don't touch the push loop at all
          if git diff --cached --quiet; then
            echo "No changes to sector/result.json or sector/state/previous_rotation.json — skipping commit."
            exit 0
          fi

          git commit -m "Auto-update sector results [$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')]"

          # Rebase onto whatever is on main right now and push, retrying a few
          # times in case something else pushes in the same window.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed successfully on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "❌ Failed to push after 5 attempts."
          exit 1
