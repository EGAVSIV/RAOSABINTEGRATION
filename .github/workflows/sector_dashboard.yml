name: Sector DB Output file

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f sector/requirements.txt ]; then pip install -r sector/requirements.txt; fi

      - name: Execute Scanner Engine
        run: |
          cd sector
          python Engine.py

      - name: Commit and Push Updated Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sector/scan_results.json sector/index.html sector/sector_rotation_weekly_report.pdf sector/sector_rotation_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sector results & HTML dashboard [3:30 PM IST]" && git push)
