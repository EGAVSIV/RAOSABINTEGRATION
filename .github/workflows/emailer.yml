name: FNO Emailer
on:
  # 1. Scheduled Run: Daily at 5:00 PM IST (11:30 AM UTC)
  schedule:
    - cron: '30 11 * * *'

  # 2. Manual Run
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up Python Environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install TA-Lib C-library
      - name: Install TA-Lib dependencies
        run: |
          sudo apt-get update
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      # Step 4: Install Python Dependencies
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r FNO_EMAILER/requirements.txt

      # Step 5: Run scanner scripts
      - name: Run EMAIL1 HTPL Script
        run: |
          python FNO_EMAILER/EMAIL1_HTPL.py

      - name: Run EMAIL2 Script
        run: |
          python FNO_EMAILER/EMAIL2.py
