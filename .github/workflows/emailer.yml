name: FNO ND RD Divergence Scanner With Confluence

on:
  # 1. Scheduled Trigger: Monday to Friday at 4:30 PM IST (11:00 AM UTC)
  schedule:
    - cron: '0 11 * * 1-5'

  # 2. Manual Trigger: Allows you to run the script manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Check out Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install TA-Lib C Library & Python Dependencies
      - name: Install TA-Lib C-Library and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          
          # Download and compile TA-Lib C Library
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

          # Upgrade pip and install Python packages (TA-Lib instead of talib-binary)
          python -m pip install --upgrade pip
          pip install numpy pandas TA-Lib pyarrow openpyxl matplotlib

      # Step 4: Execute the Divergence Scanner script
      - name: Run Divergence Scanner Script_HTPL
        run: |
          python New_Scan_30_July.py


      - name: Run NSE Scanner Script_OLD
        run: |
          python scanner.py

