name: PNTR - Generate Astro 30Y Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-astro-30y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pntr/requirements.txt

      - name: Install dependencies
        run: pip install -r pntr/requirements.txt

      - name: Generate Moon Nakshatra 30Y JSON
        run: python pntr/nakshatra_30y.py

      - name: Generate Moon Pada 30Y JSON
        run: python pntr/pada_30y.py

      - name: Commit generated 30Y JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pntr/data/moon_nakshatra_30y.json pntr/data/moon_pada_30y.json
          if git diff --cached --quiet; then
            echo "No astro data changes to commit."
          else
            git commit -m "Update PNTR 30Y astro timing data"
            git push
          fi
